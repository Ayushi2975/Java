<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do App</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    text-align: center;
}

.container {
    width: 300px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 70%;
    padding: 8px;
}

button {
    padding: 8px;
    background: green;
    color: white;
    border: none;
}

li {
    list-style: none;
    padding: 10px;
    margin: 5px;
    background: #ddd;
    display: flex;
    justify-content: space-between;
}

.delete {
    background: red;
    color: white;
    border: none;
}
</style>

</head>
<body>

<div class="container">
    <h2>To-Do List 📝</h2>
    <input type="text" id="task" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="list"></ul>
</div>

<script>
function addTask() {
    let task = document.getElementById("task").value;
    if(task === "") return;

    let li = document.createElement("li");
    li.innerHTML = task + " <button class='delete' onclick='this.parentElement.remove()'>X</button>";

    document.getElementById("list").appendChild(li);
    document.getElementById("task").value = "";
}
</script>

</body>
</html>
